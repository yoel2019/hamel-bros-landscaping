<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Hamel OS</title>
  <style>
    html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#050505}
    iframe{display:block;width:100%;height:100%;border:0;background:#0a0a0a}
  </style>
</head>
<body>
  <iframe id="hamel-os-frame" title="Hamel OS" src="../../hamel-os.html"></iframe>
  <script>
    const frame=document.getElementById('hamel-os-frame');
    frame.addEventListener('load',()=>{
      const doc=frame.contentDocument;
      if(!doc)return;
      const style=doc.createElement('style');
      style.id='hamel-os-ghost-arrows';
      style.textContent=`
        @media(max-width:900px){
          .hamel-nav-arrow{
            bottom:calc(78px + env(safe-area-inset-bottom))!important;
            width:30px!important;
            height:30px!important;
            border:0!important;
            border-radius:0!important;
            background:transparent!important;
            color:rgba(168,255,120,.46)!important;
            box-shadow:none!important;
            backdrop-filter:none!important;
            -webkit-backdrop-filter:none!important;
            opacity:.58!important;
            font-size:25px!important;
            font-weight:300!important;
            line-height:1!important;
            text-shadow:0 0 14px rgba(168,255,120,.20)!important;
            transition:opacity .22s ease,transform .22s ease!important;
            pointer-events:auto!important;
          }
          .hamel-nav-arrow.left{left:10px!important}
          .hamel-nav-arrow.right{right:10px!important}
          .hamel-nav-arrow:not(.is-hidden){
            display:grid!important;
            animation:hamelGhostArrow 2.6s ease-in-out infinite!important;
          }
          .hamel-nav-arrow.left:not(.is-hidden){animation-name:hamelGhostArrowLeft!important}
          .hamel-nav-arrow.is-hidden{
            opacity:0!important;
            transform:scale(.8)!important;
            pointer-events:none!important;
          }
          .hamel-nav-arrow::before{
            content:"";
            position:absolute;
            inset:3px -8px;
            pointer-events:none;
            background:radial-gradient(ellipse,rgba(168,255,120,.08),transparent 70%);
            filter:blur(5px);
            z-index:-1;
          }
          @keyframes hamelGhostArrow{
            0%,100%{opacity:.34;transform:translateX(0)}
            50%{opacity:.68;transform:translateX(3px)}
          }
          @keyframes hamelGhostArrowLeft{
            0%,100%{opacity:.34;transform:translateX(0)}
            50%{opacity:.68;transform:translateX(-3px)}
          }
        }
      `;
      doc.head.appendChild(style);
    });
  </script>
</body>
</html>
