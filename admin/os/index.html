<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Hamel OS</title>
  <style>
    html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#050505}
    iframe{display:block;width:100%;height:100%;border:0;background:#0a0a0a}
  </style>
</head>
<body>
  <iframe id="hamel-os-frame" title="Hamel OS" src="../../hamel-os.html"></iframe>
  <script>
    const frame=document.getElementById('hamel-os-frame');
    frame.addEventListener('load',()=>{
      const doc=frame.contentDocument;
      if(!doc) return;
      const style=doc.createElement('style');
      style.id='hamel-os-ghost-nav-arrows';
      style.textContent=`
        @media(max-width:900px){
          .hamel-nav-arrow{
            width:28px!important;
            height:28px!important;
            bottom:calc(39px + env(safe-area-inset-bottom))!important;
            border:0!important;
            border-radius:0!important;
            background:transparent!important;
            color:rgba(168,255,120,.48)!important;
            box-shadow:none!important;
            opacity:.72!important;
            font-size:22px!important;
            font-weight:400!important;
            text-shadow:0 0 12px rgba(168,255,120,.34),0 0 3px rgba(168,255,120,.5)!important;
            backdrop-filter:none!important;
            -webkit-backdrop-filter:none!important;
            transition:opacity .22s ease,transform .22s ease!important;
            pointer-events:auto!important;
          }
          .hamel-nav-arrow.left{left:2px!important}
          .hamel-nav-arrow.right{right:2px!important}
          .hamel-nav-arrow:not(.is-hidden){
            display:grid!important;
            animation:none!important;
          }
          .hamel-nav-arrow.is-hidden{
            opacity:0!important;
            transform:scale(.8)!important;
          }
          .hamel-nav-arrow::before{
            content:"";
            position:absolute;
            inset:3px -5px;
            pointer-events:none;
            background:radial-gradient(ellipse,rgba(168,255,120,.10),transparent 68%);
            filter:blur(4px);
            z-index:-1;
          }
        }
      `;
      doc.head.appendChild(style);
    });
  </script>
</body>
</html>
