<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Hamel OS</title>
  <style>
    html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#050505}
    iframe{display:block;width:100%;height:100%;border:0;background:#0a0a0a}
  </style>
</head>
<body>
  <iframe id="hamel-os-frame" title="Hamel OS" src="../../hamel-os.html"></iframe>
  <script>
    const frame=document.getElementById('hamel-os-frame');
    frame.addEventListener('load',()=>{
      const doc=frame.contentDocument;
      if(!doc) return;
      const style=doc.createElement('style');
      style.id='hamel-os-compact-translucent-nav-arrows';
      style.textContent=`
        @media(max-width:900px){
          .mobile-nav{
            padding-left:30px!important;
            padding-right:30px!important;
            height:68px!important;
          }
          .hamel-nav-arrow{
            width:20px!important;
            height:24px!important;
            bottom:calc(22px + env(safe-area-inset-bottom))!important;
            border:0!important;
            border-radius:0!important;
            background:transparent!important;
            color:rgba(168,255,120,.58)!important;
            box-shadow:none!important;
            opacity:.62!important;
            font-size:25px!important;
            font-weight:300!important;
            line-height:1!important;
            text-shadow:0 0 8px rgba(168,255,120,.55),0 0 18px rgba(168,255,120,.22)!important;
            backdrop-filter:none!important;
            -webkit-backdrop-filter:none!important;
            transition:opacity .22s ease,transform .22s ease,text-shadow .22s ease!important;
            pointer-events:auto!important;
          }
          .hamel-nav-arrow.left{left:4px!important}
          .hamel-nav-arrow.right{right:4px!important}
          .hamel-nav-arrow:not(.is-hidden){
            display:grid!important;
            animation:none!important;
          }
          .hamel-nav-arrow:active{
            opacity:.95!important;
            transform:scale(.9)!important;
            text-shadow:0 0 10px rgba(168,255,120,.8),0 0 22px rgba(168,255,120,.32)!important;
          }
          .hamel-nav-arrow.is-hidden{
            opacity:0!important;
            transform:scale(.75)!important;
          }
        }
      `;
      doc.head.appendChild(style);
    });
  </script>
</body>
</html>
