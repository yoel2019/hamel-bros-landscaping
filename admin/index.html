<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Hamel OS</title>
  <style>
    html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#050505}
    #os-frame{display:block;width:100%;height:100%;border:0;background:#0a0a0a}
    .fallback{position:fixed;inset:0;display:grid;place-items:center;background:#050505;color:#71717a;font-family:ui-sans-serif,system-ui,sans-serif;z-index:10}
    .fallback-card{text-align:center}.spinner{width:30px;height:30px;margin:0 auto 16px;border:3px solid #222622;border-top-color:#a8ff78;border-radius:50%;animation:spin .8s linear infinite}
    .fallback p{font-size:12px;letter-spacing:.14em;text-transform:uppercase;font-weight:600}.fallback a{color:#a8ff78}
    @keyframes spin{to{transform:rotate(360deg)}}
  </style>
</head>
<body>
  <iframe id="os-frame" title="Hamel OS" src="../hamel-os.html"></iframe>
  <div class="fallback" id="fallback" style="display:none">
    <div class="fallback-card">
      <div class="spinner"></div>
      <p>Loading Hamel OS…</p>
      <a href="../hamel-os.html">Open directly →</a>
    </div>
  </div>
  <script>
    const frame=document.getElementById('os-frame');
    const fallback=document.getElementById('fallback');

    frame.addEventListener('error',()=>fallback.style.display='grid');

    frame.addEventListener('load',()=>{
      const doc=frame.contentDocument;
      if(!doc) return;

      const style=doc.createElement('style');
      style.id='hamel-mobile-nav-patch';
      style.textContent=`
        @media(max-width:900px){
          .sidebar{display:none!important;width:0!important}
          .main{margin-left:0!important;padding-bottom:92px!important}
          .mobile-only{display:none!important}
          .mobile-nav{
            display:flex!important;
            justify-content:flex-start!important;
            align-items:stretch!important;
            gap:2px!important;
            overflow-x:auto!important;
            overflow-y:hidden!important;
            overscroll-behavior-x:contain!important;
            -webkit-overflow-scrolling:touch!important;
            scroll-behavior:smooth!important;
            scrollbar-width:none!important;
            padding:7px 48px 7px 8px!important;
            height:72px!important;
            box-sizing:border-box!important;
            padding-bottom:max(7px,env(safe-area-inset-bottom))!important;
            box-shadow:0 -12px 30px rgba(0,0,0,.32)!important;
          }
          .mobile-nav::-webkit-scrollbar{display:none!important}
          .mobile-nav>button{
            flex:0 0 78px!important;
            min-width:78px!important;
            height:56px!important;
            display:flex!important;
            flex-direction:column!important;
            justify-content:center!important;
            align-items:center!important;
            gap:4px!important;
            border-radius:10px!important;
            font-size:9px!important;
            font-weight:650!important;
            touch-action:pan-x!important;
          }
          .mobile-nav>button:active{background:#182018!important;transform:scale(.97)}
          .hamel-nav-arrow{
            position:fixed!important;
            bottom:calc(16px + env(safe-area-inset-bottom))!important;
            width:34px!important;height:34px!important;
            z-index:100!important;
            border:1px solid #343a34!important;
            border-radius:50%!important;
            background:rgba(13,17,13,.94)!important;
            color:#a8ff78!important;
            display:grid!important;place-items:center!important;
            font-size:20px!important;line-height:1!important;
            box-shadow:0 5px 18px rgba(0,0,0,.45)!important;
            transition:opacity .18s,transform .18s!important;
            backdrop-filter:blur(10px)!important;
          }
          .hamel-nav-arrow.left{left:8px!important}
          .hamel-nav-arrow.right{right:8px!important}
          .hamel-nav-arrow.is-hidden{opacity:0!important;pointer-events:none!important;transform:scale(.8)!important}
          .hamel-nav-arrow.right:not(.is-hidden){animation:hamelArrowPulse 2s ease-in-out infinite}
          @keyframes hamelArrowPulse{0%,100%{box-shadow:0 5px 18px rgba(0,0,0,.45)}50%{box-shadow:0 5px 22px rgba(168,255,120,.22)}}
        }
      `;
      doc.head.appendChild(style);

      const nav=doc.querySelector('.mobile-nav');
      if(!nav) return;

      const labels=['Overview','Dispatch','Fleet','Jobs','People','Time','Evidence','Timeline'];
      const icons=['grid','route','map','jobs','users','clock','camera','timeline'];
      const sidebarButtons=()=>Array.from(doc.querySelectorAll('.sidebar button'));
      let syncing=false;

      const syncNav=()=>{
        if(syncing) return;
        syncing=true;
        const buttons=Array.from(nav.querySelectorAll(':scope > button'));
        const side=sidebarButtons();
        labels.forEach((label,i)=>{
          let b=buttons[i];
          if(!b){
            b=doc.createElement('button');
            nav.appendChild(b);
          }
          b.setAttribute('aria-label',label);
          b.innerHTML=`<span style="display:grid;place-items:center;height:20px"></span><div>${label}</div>`;
          const iconHost=b.firstElementChild;
          const source=side[i]?.querySelector('svg');
          if(source) iconHost.appendChild(source.cloneNode(true));
          b.onclick=()=>side[i]?.click();
        });
        Array.from(nav.querySelectorAll(':scope > button')).slice(labels.length).forEach(b=>b.remove());
        syncing=false;
        updateArrows();
      };

      let left,right;
      const makeArrow=(dir)=>{
        const b=doc.createElement('button');
        b.className='hamel-nav-arrow '+dir;
        b.type='button';
        b.setAttribute('aria-label',dir==='right'?'Show more menus':'Show previous menus');
        b.textContent=dir==='right'?'→':'←';
        b.addEventListener('click',()=>nav.scrollBy({left:dir==='right'?270:-270,behavior:'smooth'}));
        doc.body.appendChild(b);
        return b;
      };
      left=makeArrow('left'); right=makeArrow('right');

      const updateArrows=()=>{
        if(window.innerWidth>900) return;
        const max=Math.max(0,nav.scrollWidth-nav.clientWidth);
        left.classList.toggle('is-hidden',nav.scrollLeft<=8);
        right.classList.toggle('is-hidden',nav.scrollLeft>=max-8);
      };

      syncNav();
      nav.addEventListener('scroll',updateArrows,{passive:true});
      window.addEventListener('resize',updateArrows);

      const observer=new MutationObserver(()=>{
        if(!nav.isConnected) return;
        syncNav();
      });
      observer.observe(nav,{childList:true,subtree:false});
      setTimeout(updateArrows,100);
    });
  </script>
</body>
</html>
