name: Fix Hamel Bros asset paths

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix-logo-path:
    if: ${{ !contains(github.event.head_commit.message, '[skip ci]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fix moved logo references
        shell: bash
        run: |
          set -e
          if git grep -Il 'hamelBros\.LandscapingLogo\.png' -- '*.html' '*.md' '*.txt' '*.css' '*.js' >/tmp/logo-files; then
            while IFS= read -r file; do
              sed -i 's#hamelBros\.LandscapingLogo\.png#assets/logo/hamelBros.LandscapingLogo.png#g' "$file"
            done < /tmp/logo-files
          fi

      - name: Commit corrected paths
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No logo path corrections needed.'
            exit 0
          fi
          git commit -m 'fix: update references to moved logo [skip ci]'
          git push
