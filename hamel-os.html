:root{--black:#0a0a0a;--dark:#0d110d;--card:#121412;--border:#222622;--lime:#a8ff78;--muted:#71717a;--blue:#60a5fa}*{box-sizing:border-box}html,body,#root{min-height:100%;margin:0}body{background:var(--black);color:#e4e4e7;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;overflow-x:hidden}button,input{font:inherit}button{cursor:pointer}.fade{animation:fade .22s ease}@keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}.pulse{animation:pulse 1.8s ease-out infinite}@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(168,255,120,.45)}70%{box-shadow:0 0 0 12px rgba(168,255,120,0)}100%{box-shadow:0 0 0 0 rgba(168,255,120,0)}}.radar{background-color:#091009;background-image:linear-gradient(rgba(168,255,120,.055) 1px,transparent 1px),linear-gradient(90deg,rgba(168,255,120,.055) 1px,transparent 1px);background-size:42px 42px}.road{fill:none;stroke:#303630;stroke-width:7;stroke-linecap:round}.road2{fill:none;stroke:#1a1e1a;stroke-width:2}.dash{fill:none;stroke:var(--lime);stroke-width:3;stroke-dasharray:9 7;animation:dash 1.2s linear infinite}@keyframes dash{to{stroke-dashoffset:-32}}input{background:#0d110d;border:1px solid var(--border);color:#e4e4e7;border-radius:9px;padding:9px 11px;outline:none;width:100%}input:focus{border-color:var(--lime)}.progress{transition:width .5s ease}@media(max-width:900px){.sidebar{width:74px!important}.sidebar-label{display:none!important}.main{margin-left:74px!important}}@media(max-width:640px){.sidebar{display:none!important}.main{margin-left:0!important;padding-bottom:70px}.mobile-nav{display:flex!important}.page{padding:14px!important}.grid-kpi{grid-template-columns:repeat(2,minmax(0,1fr))!important}.two-col,.map-layout{grid-template-columns:1fr!important}.map-canvas{height:430px!important}.topbar-search{display:none!important}.mobile-only{display:block!important}}

const Icon=({n,s=18})=>{const p={width:s,height:s,fill:'none',stroke:'currentColor',strokeWidth:1.8,strokeLinecap:'round',strokeLinejoin:'round',viewBox:'0 0 24 24'};let d={grid:<><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/></>,map:<><path d="M20 10c0 6-8 11-8 11S4 16 4 10a8 8 0 1 1 16 0Z"/><circle cx="12" cy="10" r="2.5"/></>,truck:<><path d="M3 6h11v10H3z"/><path d="M14 9h4l3 3v4h-7z"/><circle cx="7" cy="18" r="2"/><circle cx="18" cy="18" r="2"/></>,users:<><circle cx="9" cy="7" r="4"/><path d="M2 21v-2a4 4 0 0 1 4-4h6a4 4 0 0 1 4 4v2"/><path d="M16 3.5a4 4 0 0 1 0 7.5"/></>,clock:<><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></>,jobs:<><rect x="3" y="4" width="18" height="17" rx="2"/><path d="M8 4V2h8v2M7 9h10M7 13h6"/></>,camera:<><path d="M4 7h4l2-2h4l2 2h4v12H4z"/><circle cx="12" cy="13" r="3"/></>,timeline:<><path d="M5 5h14M5 12h14M5 19h9"/></>,bell:<><path d="M18 8a6 6 0 0 0-12 0c0 7-3 8-3 8h18s-3-1-3-8"/><path d="M10 20h4"/></>,search:<><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></>,plus:<><path d="M12 5v14M5 12h14"/></>,route:<><circle cx="6" cy="18" r="2"/><circle cx="18" cy="6" r="2"/><path d="M8 18h3a4 4 0 0 0 4-4v-2a4 4 0 0 1 4-4"/></>,menu:<><path d="M4 7h16M4 12h16M4 17h16"/></>,x:<><path d="m6 6 12 12M18 6 6 18"/></>,check:<path d="m5 12 4 4L19 6"/>};return <svg {...p}>{d[n]||d.grid}</svg>};

function Nav({item,active,onClick}){return <button onClick={onClick} style={{display:'flex',alignItems:'center',gap:11,width:'100%',padding:'10px 11px',border:0,borderRadius:9,textAlign:'left',background:active?'#1b221b':'transparent',color:active?'#fff':'#858b85',fontSize:12,fontWeight:active?700:550,position:'relative'}}><span style={{color:active?'#a8ff78':'inherit'}}><Icon n={item[2]} s={17}/></span><span className="sidebar-label">{item[1]}</span>{active&&<i style={{position:'absolute',right:7,width:4,height:18,borderRadius:3,background:'#a8ff78'}}/>}</button>}
const nav=[['overview','Overview','grid'],['dispatch','Dispatch Board','route'],['fleet','Live Fleet','map'],['jobs','Jobs','jobs'],['people','People','users'],['clock','Time Clock','clock'],['evidence','Evidence Feed','camera'],['timeline','Timeline','timeline']];
function App(){const[data,setData]=useState(initial),[page,setPage]=useState('overview'),[selected,setSelected]=useState('a'),[toast,setToast]=useState(null),[drawer,setDrawer]=useState(false);const notify=x=>{setToast(x);setTimeout(()=>setToast(null),2200)};useEffect(()=>{if(page!=='fleet')return;let t=setInterval(()=>setData(d=>({...d,crews:d.crews.map(c=>c.status==='EN ROUTE'?{...c,x:c.x+1.2>88?10:c.x+1.2,y:c.y+.25,speed:Math.max(18,Math.min(31,c.speed+(Math.random()-.5)*2))}:c)})),1100);return()=>clearInterval(t)},[page]);const start=()=>{setData(d=>({...d,crews:d.crews.map(c=>c.id==='a'?{...c,status:'EN ROUTE',speed:24,progress:Math.max(c.progress,8)}:c),jobs:d.jobs.map(j=>j.id==='J-1042'?{...j,status:'On the Way',progress:Math.max(j.progress,8)}:j),events:[['10:24','Jimmy Hamel','Route started','Vanderbilt Residence','lime'],...d.events]}));notify('Crew Alpha · route started')};const complete=()=>{setData(d=>({...d,crews:d.crews.map(c=>c.id==='a'?{...c,status:'AVAILABLE',speed:0,progress:100}:c),jobs:d.jobs.map(j=>j.id==='J-1042'?{...j,status:'Completed',progress:100}:j),events:[['10:26','Crew Alpha','Job completed','Vanderbilt Residence · sign-off','lime'],...d.events]}));notify('J-1042 · completed')};return <div style={{minHeight:'100vh'}}><aside className="sidebar" style={{position:'fixed',zIndex:30,left:0,top:0,bottom:0,width:238,background:'#0d110d',borderRight:'1px solid #222622',display:'flex',flexDirection:'column'}}><div style={{height:74,padding:'14px 16px',display:'flex',alignItems:'center',gap:10,borderBottom:'1px solid #222622'}}><img src={LOGO} style={{width:44,height:44,objectFit:'contain'}}/><div className="brand-text"><b style={{fontSize:14,color:'#fff'}}>HAMEL OS</b><div style={{fontSize:10,color:'#71717a'}}>FIELD INTELLIGENCE</div></div></div><div className="sidebar-label" style={{padding:'18px 10px 8px',fontSize:9,fontWeight:800,color:'#555b55',letterSpacing:1.5}}>OPERATIONS</div><nav style={{padding:'0 8px',display:'grid',gap:3}}>{nav.slice(0,4).map(n=><Nav key={n[0]} item={n} active={page===n[0]} onClick={()=>setPage(n[0])}/>)}</nav><div className="sidebar-label" style={{padding:'18px 10px 8px',fontSize:9,fontWeight:800,color:'#555b55',letterSpacing:1.5}}>WORKFORCE</div><nav style={{padding:'0 8px',display:'grid',gap:3}}>{nav.slice(4).map(n=><Nav key={n[0]} item={n} active={page===n[0]} onClick={()=>setPage(n[0])}/>)}</nav><div style={{marginTop:'auto',padding:10}}><div style={{border:'1px solid #222622',borderRadius:11,padding:10,background:'#101310'}}><div style={{display:'flex',alignItems:'center',gap:8}}><i className="pulse" style={{width:8,height:8,borderRadius:'50%',background:'#a8ff78'}}/><b style={{fontSize:11}}>SIMULATION ONLINE</b></div><div style={{fontSize:9,color:'#71717a',marginTop:5}}>Mock production environment</div></div></div></aside><main className="main" style={{marginLeft:238,minHeight:'100vh'}}><header style={{height:74,borderBottom:'1px solid #222622',background:'rgba(10,10,10,.92)',backdropFilter:'blur(14px)',display:'flex',alignItems:'center',justifyContent:'space-between',padding:'0 22px',position:'sticky',top:0,zIndex:20}}><div style={{display:'flex',alignItems:'center',gap:12}}><button className="mobile-only" onClick={()=>setDrawer(true)} style={{display:'none',border:0,background:'none',color:'#aaa'}}><Icon n="menu"/></button><div><div style={{fontSize:11,color:'#71717a'}}>Hamel Bros. Landscaping</div><div style={{fontSize:18,fontWeight:780,color:'#fff'}}>{nav.find(n=>n[0]===page)[1]}</div></div></div><div style={{display:'flex',alignItems:'center',gap:9}}><div className="topbar-search" style={{display:'flex',gap:8,border:'1px solid #222622',background:'#101210',borderRadius:9,padding:'8px 11px',width:230,color:'#71717a'}}><Icon n="search" s={15}/><span style={{fontSize:12}}>Search · ⌘K</span></div><button onClick={()=>notify('No new critical alerts')} style={{width:36,height:36,border:'1px solid #222622',background:'#101210',borderRadius:9,color:'#aaa'}}><Icon n="bell" s={17}/></button><div style={{width:34,height:34,borderRadius:'50%',background:'#202520',display:'grid',placeItems:'center',color:'#a8ff78',fontWeight:800}}>Y</div></div></header><div className="page" style={{padding:22,maxWidth:1600,margin:'0 auto'}}>{page==='overview'?<Overview data={data} setPage={setPage} start={start}/>:page==='dispatch'?<Dispatch data={data} selected={selected} setSelected={setSelected} start={start} complete={complete}/>:page==='fleet'?<Fleet data={data} selected={selected} setSelected={setSelected}/>:page==='jobs'?<Jobs data={data} notify={notify}/>:page==='people'?<People data={data}/>:page==='clock'?<Clock data={data} setData={setData} notify={notify}/>:page==='evidence'?<Evidence/>:<Timeline data={data}/>}</div></main><nav className="mobile-nav" style={{display:'none',position:'fixed',bottom:0,left:0,right:0,height:64,zIndex:40,background:'#0d110d',borderTop:'1px solid #222622',justifyContent:'space-around',alignItems:'center'}}>{nav.slice(0,5).map(n=><button key={n[0]} onClick={()=>setPage(n[0])} style={{border:0,background:'none',color:page===n[0]?'#a8ff78':'#71717a',fontSize:9}}><Icon n={n[2]} s={18}/><div>{n[1].split(' ')[0]}</div></button>)}</nav>{drawer&&<div onClick={()=>setDrawer(false)} style={{position:'fixed',inset:0,zIndex:50,background:'rgba(0,0,0,.65)'}}><aside onClick={e=>e.stopPropagation()} style={{width:270,height:'100%',background:'#0d110d',padding:18}}><div style={{display:'flex',justifyContent:'space-between',marginBottom:22}}><b>HAMEL OS</b><button onClick={()=>setDrawer(false)} style={{border:0,background:'none',color:'#aaa'}}><Icon n="x"/></button></div>{nav.map(n=><Nav key={n[0]} item={n} active={page===n[0]} onClick={()=>{setPage(n[0]);setDrawer(false)}}/>)}</aside></div>}{toast&&<div className="fade" style={{position:'fixed',right:20,bottom:20,zIndex:60,background:'#a8ff78',color:'#091006',padding:'11px 15px',borderRadius:10,fontSize:12,fontWeight:750}}>{toast}</div>}</div>}
function Header({eyebrow,title,action}){return <div style={{display:'flex',alignItems:'end',justifyContent:'space-between',gap:15,marginBottom:20}}><div><div style={{fontSize:10,color:'#a8ff78',fontWeight:800,letterSpacing:1.4,textTransform:'uppercase'}}>{eyebrow}</div><h1 style={{fontSize:26,lineHeight:1.15,margin:'5px 0 0',color:'#fff'}}>{title}</h1></div>{action}</div>}

function CrewRow({c,onClick}){return <div onClick={onClick} style={{padding:'11px 0',cursor:onClick?'pointer':'default',borderBottom:'1px solid #1d211d'}}><div style={{display:'flex',justifyContent:'space-between',gap:8}}><div><b style={{fontSize:12}}>{c.name}</b><div style={{fontSize:10,color:'#71717a',marginTop:3}}>{c.vehicle} · {c.job}</div></div><Badge tone={c.status==='WORKING'?'blue':c.status==='SCHEDULED'?'gray':'lime'}>{c.status}</Badge></div><div style={{height:4,background:'#202420',borderRadius:5,marginTop:9}}><div className="progress" style={{height:'100%',width:c.progress+'%',background:'#a8ff78',borderRadius:5}}/></div></div>}
function MiniMap({data,onOpen}){return <div className="radar map-canvas" onClick={onOpen} style={{height:400,position:'relative',overflow:'hidden',cursor:onOpen?'pointer':'default'}}><svg viewBox="0 0 800 400" width="100%" height="100%"><path className="road" d="M20 340 C150 300 120 180 260 160 S480 120 780 45"/><path className="road" d="M40 70 C170 110 220 260 380 290 S610 310 780 330"/><path className="road" d="M300 20 C340 110 470 120 500 210 S570 350 650 390"/>{data.crews.map(c=><g key={c.id} transform={'translate('+(c.x/100*800)+','+(c.y/100*400)+')'}><circle r="16" fill={c.color} opacity=".12" className={c.status==='EN ROUTE'?'pulse':''}/><circle r="5" fill={c.color}/></g>)}</svg><div style={{position:'absolute',top:14,left:14,background:'rgba(10,10,10,.84)',border:'1px solid #2b302b',borderRadius:9,padding:'8px 10px'}}><b style={{fontSize:10}}>METRO WEST · LIVE RADAR</b><div style={{fontSize:9,color:'#71717a',marginTop:2}}>GPS simulation · live movement</div></div></div>}
function Overview({data,setPage,start}){return <div className="fade"><Header eyebrow="Operations center" title="Good evening, Hamel team." action={<Button primary onClick={start}><Icon n="route" s={15}/> Start simulated route</Button>}/><div className="grid-kpi" style={{display:'grid',gridTemplateColumns:'repeat(4,1fr)',gap:12,marginBottom:16}}><Kpi label="Active crews" value="2/3" sub="1 scheduled" icon="users"/><Kpi label="Jobs today" value="4" sub="2 in progress" icon="jobs"/><Kpi label="Fleet online" value="3/4" sub="1 parked" icon="truck"/><Kpi label="Hours logged" value="31.4" sub="6 employees" icon="clock"/></div><div className="two-col" style={{display:'grid',gridTemplateColumns:'1.5fr 1fr',gap:14}}><Card style={{overflow:'hidden'}}><div style={{padding:'14px 16px',borderBottom:'1px solid #222622',display:'flex',justifyContent:'space-between'}}><div><b style={{fontSize:13}}>Live field overview</b><div style={{fontSize:10,color:'#71717a',marginTop:3}}>Open Live Fleet for moving GPS units</div></div><Badge>LIVE</Badge></div><MiniMap data={data} onOpen={()=>setPage('fleet')}/></Card><div style={{display:'grid',gap:14}}><Section title="Today's route" action={<Button small onClick={()=>setPage('dispatch')}>Open board</Button>}>{data.crews.map(c=><CrewRow key={c.id} c={c}/>)}</Section><Section title="Latest activity" action={<Button small onClick={()=>setPage('timeline')}>Timeline</Button>}>{data.events.slice(0,4).map((e,i)=><Event key={i} e={e}/>)}</Section></div></div></div>}

function Dispatch({data,selected,setSelected,start,complete}){const c=data.crews.find(x=>x.id===selected)||data.crews[0];return <div className="fade"><Header eyebrow="Operations" title="Dispatch Board" action={<div style={{display:'flex',gap:8}}><Button primary onClick={start}><Icon n="route" s={15}/> Start Route</Button><Button><Icon n="plus" s={15}/> Assign job</Button></div>}/><div className="two-col" style={{display:'grid',gridTemplateColumns:'.8fr 1.5fr',gap:14}}><Section title="Active crews" action={<Badge>3 TOTAL</Badge>}>{data.crews.map(x=><div key={x.id} onClick={()=>setSelected(x.id)} style={{padding:'0 6px',border:x.id===selected?'1px solid #a8ff78':'1px solid transparent',background:x.id===selected?'#182018':'transparent',borderRadius:10,margin:'4px 0'}}><CrewRow c={x}/></div>)}</Section><Card><div style={{padding:16,borderBottom:'1px solid #222622',display:'flex',justifyContent:'space-between'}}><div><b style={{fontSize:17}}>{c.name}</b><div style={{fontSize:10,color:'#71717a',marginTop:3}}>{c.leader} · {c.vehicle}</div></div><Badge tone={c.status==='WORKING'?'blue':c.status==='SCHEDULED'?'gray':'lime'}>{c.status}</Badge></div><div style={{padding:16}}><div className="two-col" style={{display:'grid',gridTemplateColumns:'1.1fr .9fr',gap:14}}><MiniMap data={{crews:[c]}}/><div style={{display:'grid',gap:9}}><Info label="CURRENT JOB" value={c.job}/><Info label="ADDRESS" value={c.address}/><Info label="SPEED" value={c.speed?c.speed.toFixed(0)+' MPH':'Parked'}/><Info label="JOB PROGRESS" value={c.progress+'%'}/><div style={{display:'flex',gap:7}}><Button small primary onClick={start}>Simulate update</Button><Button small onClick={complete}>Complete</Button></div></div></div></div></Card></div></div>}
const Info=({label,value})=><div style={{border:'1px solid #222622',background:'#0e100e',borderRadius:9,padding:'9px 10px'}}><div style={{fontSize:8,color:'#71717a',fontWeight:800,letterSpacing:1}}>{label}</div><div style={{fontSize:11,fontWeight:700,marginTop:4}}>{value}</div></div>;
function Fleet({data,selected,setSelected}){const c=data.crews.find(x=>x.id===selected)||data.crews[0];return <div className="fade"><Header eyebrow="Telemetry" title="Live Fleet Map" action={<div style={{display:'flex',gap:7}}><Badge>● LIVE GPS</Badge><Button small>Map layers</Button></div>}/><div className="map-layout" style={{display:'grid',gridTemplateColumns:'1.7fr .65fr',gap:14}}><Card style={{overflow:'hidden'}}><div className="radar map-canvas" style={{height:650,position:'relative'}}><svg viewBox="0 0 1000 650" width="100%" height="100%"><path className="road" d="M10 540 C190 480 130 300 330 270 S590 250 980 70"/><path className="road" d="M40 80 C230 120 250 440 470 470 S750 500 970 580"/><path className="road" d="M380 0 C420 150 590 130 610 300 S680 530 820 650"/>{data.crews.map(x=><g key={x.id} transform={'translate('+(x.x/100*1000)+','+(x.y/100*650)+')'} onClick={()=>setSelected(x.id)} style={{cursor:'pointer'}}><circle r="24" fill={x.color} opacity=".1" className={x.status==='EN ROUTE'?'pulse':''}/><circle r="9" fill="#0a0a0a" stroke={x.color} strokeWidth="3"/><circle r="4" fill={x.color}/><text y="-17" textAnchor="middle" fill="#ddd" fontSize="12" fontWeight="700">{x.vehicle.split(' · ')[0]}</text></g>)}</svg><div style={{position:'absolute',top:15,left:15,background:'rgba(10,10,10,.88)',border:'1px solid #2a302a',borderRadius:10,padding:'9px 11px'}}><b style={{fontSize:10}}>FIELD RADAR</b><div style={{fontSize:9,color:'#71717a',marginTop:3}}>Live simulated telemetry · 1.1s</div></div><div style={{position:'absolute',bottom:15,left:15,display:'flex',gap:6}}><Badge>EN ROUTE</Badge><Badge tone="blue">WORKING</Badge><Badge tone="gray">SCHEDULED</Badge></div></div></Card><Card><div style={{padding:'14px 16px',borderBottom:'1px solid #222622'}}><b style={{fontSize:13}}>Fleet telemetry</b><span style={{float:'right',fontSize:9,color:'#71717a'}}>LIVE</span></div><div style={{padding:8}}>{data.crews.map(x=><button key={x.id} onClick={()=>setSelected(x.id)} style={{width:'100%',textAlign:'left',background:x.id===c.id?'#182018':'transparent',border:x.id===c.id?'1px solid #334133':'1px solid transparent',borderRadius:10,color:'#eee',padding:12,marginBottom:5}}><div style={{display:'flex',justifyContent:'space-between'}}><b style={{fontSize:12}}>{x.vehicle.split(' · ')[0]}</b><Badge tone={x.status==='WORKING'?'blue':x.status==='SCHEDULED'?'gray':'lime'}>{x.status}</Badge></div><div style={{fontSize:10,color:'#71717a',marginTop:5}}>{x.name} · {x.job}</div><div style={{display:'flex',gap:18,marginTop:9}}><span><b style={{fontSize:15}}>{x.speed?x.speed.toFixed(0):0}</b> <small style={{color:'#71717a'}}>MPH</small></span><span><b style={{fontSize:15}}>{x.progress}</b><small style={{color:'#71717a'}}>% JOB</small></span></div></button>)}</div><div style={{borderTop:'1px solid #222622',padding:14}}><div style={{fontSize:9,color:'#71717a'}}>SELECTED UNIT</div><div style={{fontSize:17,fontWeight:800,marginTop:5}}>{c.vehicle}</div><div style={{fontSize:10,color:'#71717a',marginTop:3}}>Coordinates simulated · {c.x.toFixed(1)}, {c.y.toFixed(1)}</div><div style={{marginTop:11}}><Info label="SIGNAL" value="Strong · 98%"/><div style={{height:7}}/><Info label="LAST UPDATE" value="Just now"/></div></div></Card></div></div>}
function Jobs({data,notify}){const[f,setF]=useState('All'),list=data.jobs.filter(j=>f==='All'||j.status===f);return <div className="fade"><Header eyebrow="Work orders" title="Jobs" action={<Button primary onClick={()=>notify('New job form opened in simulation')}><Icon n="plus" s={15}/> New Job</Button>}/><div style={{display:'flex',gap:6,overflowX:'auto',marginBottom:12}}>{['All','Scheduled','On the Way','Working','Needs Dispatch','Completed'].map(x=><button key={x} onClick={()=>setF(x)} style={{whiteSpace:'nowrap',border:'1px solid '+(f===x?'#a8ff78':'#222622'),background:f===x?'#172017':'#111311',color:f===x?'#a8ff78':'#888',borderRadius:999,padding:'7px 11px',fontSize:10}}>{x}</button>)}</div><Card><div style={{overflowX:'auto'}}><table style={{width:'100%',borderCollapse:'collapse',minWidth:720}}><thead><tr>{['Job','Property / Client','Crew','Status','Progress','Start'].map(h=><th key={h} style={{textAlign:'left',padding:'12px 14px',fontSize:9,color:'#71717a',borderBottom:'1px solid #222622'}}>{h.toUpperCase()}</th>)}</tr></thead><tbody>{list.map(j=><tr key={j.id}><td style={{padding:13,fontSize:11,fontWeight:800,borderBottom:'1px solid #1d211d'}}>{j.id}</td><td style={{padding:13,borderBottom:'1px solid #1d211d'}}><b style={{fontSize:11}}>{j.property}</b><div style={{fontSize:9,color:'#71717a',marginTop:3}}>{j.client}</div></td><td style={{padding:13,fontSize:10,borderBottom:'1px solid #1d211d'}}>{j.crew}</td><td style={{padding:13,borderBottom:'1px solid #1d211d'}}><Badge tone={j.status==='Working'?'blue':j.status==='Needs Dispatch'?'yellow':j.status==='Completed'?'gray':'lime'}>{j.status}</Badge></td><td style={{padding:13,minWidth:130,borderBottom:'1px solid #1d211d'}}><div style={{display:'flex',alignItems:'center',gap:8}}><div style={{height:4,background:'#252925',borderRadius:4,flex:1}}><div style={{height:'100%',width:j.progress+'%',background:'#a8ff78'}}/></div><span style={{fontSize:9}}>{j.progress}%</span></div></td><td style={{padding:13,fontSize:10,color:'#aaa',borderBottom:'1px solid #1d211d'}}>{j.time}</td></tr>)}</tbody></table></div></Card></div>}
function People({data}){return <div className="fade"><Header eyebrow="Workforce" title="People" action={<Button primary><Icon n="plus" s={15}/> Add employee</Button>}/><div className="grid-kpi" style={{display:'grid',gridTemplateColumns:'repeat(4,1fr)',gap:12,marginBottom:14}}><Kpi label="Employees" value="6" sub="2 leaders" icon="users"/><Kpi label="Clocked in" value="4" sub="Currently active" icon="clock"/><Kpi label="Crews" value="3" sub="Field teams" icon="route"/><Kpi label="Available" value="2" sub="Ready to dispatch" icon="check"/></div><Card><div style={{display:'grid',gridTemplateColumns:'repeat(auto-fit,minmax(230px,1fr))'}}>{data.employees.map(e=><div key={e.id} style={{padding:15,borderBottom:'1px solid #222622'}}><div style={{display:'flex',gap:10,alignItems:'center'}}><div style={{width:36,height:36,borderRadius:'50%',background:'#202520',display:'grid',placeItems:'center',color:'#a8ff78',fontWeight:800}}>{e.name[0]}</div><div><b style={{fontSize:12}}>{e.name}</b><div style={{fontSize:9,color:'#71717a'}}>{e.role} · {e.crew}</div></div></div><div style={{marginTop:12}}><Badge tone={e.clocked?'lime':'gray'}>{e.clocked?'CLOCKED IN':'OFF CLOCK'}</Badge></div></div>)}</div></Card></div>}
function Clock({data,setData,notify}){const[pin,setPin]=useState(''),e=data.employees[0];const punch=()=>{if(pin.length!==4)return notify('Enter a 4-digit PIN');setData(d=>({...d,employees:d.employees.map(x=>x.id===e.id?{...x,clocked:!x.clocked}:x)}));notify(e.clocked?'Clocked out · 6.2h today':'Clocked in · GPS validation simulated');setPin('')};return <div className="fade"><Header eyebrow="Workforce" title="Time Clock"/><div style={{maxWidth:620,margin:'25px auto'}}><Card style={{padding:22,textAlign:'center'}}><div style={{fontSize:11,color:'#71717a'}}>CURRENT LOCAL TIME</div><div style={{fontSize:58,fontWeight:850,color:'#fff',margin:'8px 0'}}>{new Date().toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'})}</div><div style={{fontSize:11,color:'#a8ff78',marginBottom:22}}>GPS validation · simulated</div><div style={{maxWidth:260,margin:'0 auto 15px'}}><input value={pin} readOnly placeholder="Enter PIN" style={{fontSize:22,textAlign:'center',letterSpacing:8}}/></div><div style={{display:'grid',gridTemplateColumns:'repeat(3,1fr)',gap:7,maxWidth:260,margin:'0 auto'}}>{['1','2','3','4','5','6','7','8','9','C','0','⌫'].map(k=><button key={k} onClick={()=>k==='C'?setPin(''):k==='⌫'?setPin(pin.slice(0,-1)):pin.length<4&&setPin(pin+k)} style={{height:48,border:'1px solid #222622',background:'#101310',color:'#eee',borderRadius:8}}>{k}</button>)}</div><button onClick={punch} style={{marginTop:15,width:'100%',maxWidth:260,height:54,border:'1px solid #a8ff78',background:'#a8ff78',color:'#091006',borderRadius:10,fontWeight:850}}>{e.clocked?'CLOCK OUT':'CLOCK IN'}</button><div style={{display:'flex',justifyContent:'center',gap:35,marginTop:20}}><div><b style={{fontSize:20}}>6.2</b><div style={{fontSize:9,color:'#71717a'}}>HOURS TODAY</div></div><div><b style={{fontSize:20}}>31.4</b><div style={{fontSize:9,color:'#71717a'}}>THIS WEEK</div></div></div></Card></div></div>}
function Evidence(){return <div className="fade"><Header eyebrow="Proof of work" title="Evidence Feed" action={<Badge>4 ITEMS</Badge>}/><div style={{display:'grid',gridTemplateColumns:'repeat(auto-fit,minmax(220px,1fr))',gap:12}}>{[['BEFORE','Vanderbilt Residence','10:22 AM'],['AFTER','Smith Family Estate','—'],['BEFORE','Smith Family Estate','10:07 AM'],['AFTER','Vanderbilt Residence','Pending']].map((p,i)=><Card key={i} style={{overflow:'hidden'}}><div style={{height:150,background:'linear-gradient(135deg,#182018,#0b0d0b)',display:'grid',placeItems:'center',color:'#4b564b'}}><Icon n="camera" s={35}/></div><div style={{padding:13}}><div style={{display:'flex',justifyContent:'space-between'}}><Badge tone={p[0]==='AFTER'?'lime':'blue'}>{p[0]}</Badge><span style={{fontSize:9,color:'#71717a'}}>{p[2]}</span></div><b style={{fontSize:12,display:'block',marginTop:9}}>{p[1]}</b><div style={{fontSize:9,color:'#71717a',marginTop:3}}>Crew Alpha · attached to job record</div></div></Card>)}</div></div>}
function Timeline({data}){return <div className="fade"><Header eyebrow="Audit trail" title="Timeline" action={<Badge>LIVE FEED</Badge>}/><Card><div style={{padding:'5px 18px'}}>{data.events.map((e,i)=><div key={i} style={{display:'grid',gridTemplateColumns:'58px 15px 1fr',gap:13,padding:'17px 0',borderBottom:i<data.events.length-1?'1px solid #222622':'none'}}><div style={{fontSize:10,color:'#71717a'}}>{e[0]}</div><i style={{width:9,height:9,borderRadius:'50%',background:e[4]==='blue'?'#60a5fa':'#a8ff78',marginTop:2}}/><div><b style={{fontSize:12}}>{e[2]}</b><div style={{fontSize:10,color:'#71717a',marginTop:4}}>{e[1]} · {e[3]}</div></div></div>)}</div></Card></div>}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script></body></html>
