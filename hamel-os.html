function Shell({children,title,onLogout}){return <div className="min-h-screen bg-black"><header className="sticky top-0 z-10 flex items-center justify-between border-b border-border bg-black/90 px-4 py-3 backdrop-blur"><div><b>HAMEL <span className="text-lime">OS</span></b><div className="text-[10px] uppercase tracking-widest text-muted">{title}</div></div>{onLogout&&<button onClick={onLogout} className="rounded-lg border border-border px-3 py-2 text-xs">Logout</button>}</header><main className="mx-auto max-w-7xl p-4 md:p-6">{children}</main></div>}
function Login({setRole}){const [pin,setPin]=useState('');const [err,setErr]=useState('');const enter=role=>{if(role==='admin'||role==='client'){setRole(role);return}const e=seed.employees.find(x=>x.pin===pin);if(!e){setErr('Invalid PIN');return}setRole(e.role==='leader'?'leader':'employee');};return <div className="grid min-h-screen place-items-center bg-[radial-gradient(circle_at_center,#173017,black_55%)] p-5"><div className="w-full max-w-md rounded-3xl border border-border bg-panel p-7 text-center"><div className="mb-7 text-2xl font-black">HAMEL <span className="text-lime">OS</span></div><p className="mb-5 text-sm text-muted">Field Intelligence & Operations</p><div className="mb-4 grid grid-cols-2 gap-2"><button onClick={()=>enter('admin')} className="rounded-xl bg-lime px-4 py-3 font-bold text-black">Admin</button><button onClick={()=>enter('client')} className="rounded-xl border border-border px-4 py-3">Client Tracker</button></div><input value={pin} onChange={e=>setPin(e.target.value.replace(/\D/g,'').slice(0,4))} onKeyDown={e=>e.key==='Enter'&&enter('employee')} placeholder="Employee PIN" className="w-full rounded-xl border border-border bg-black p-3 text-center tracking-[.5em] outline-none focus:border-lime"/><button onClick={()=>enter('employee')} className="mt-3 w-full rounded-xl border border-lime px-4 py-3 font-bold text-lime">Employee / Crew Leader</button>{err&&<p className="mt-3 text-sm text-red-400">{err}</p>}</div></div>}
function Admin({data,setData,out}){const [tab,setTab]=useState('dispatch');const [crewId,setCrewId]=useState(data.crews[0]?.id);const [msg,setMsg]=useState('');const [job,setJob]=useState({client:'',address:'',service:'',time:''});const crew=data.crews.find(c=>c.id===crewId);const save=fn=>setData(d=>{const n=clone(d);fn(n);return n});return <Shell title="Dispatcher / Admin" onLogout={out}><div className="mb-5 flex flex-wrap gap-2">{['dispatch','jobs','employees'].map(x=><button onClick={()=>setTab(x)} className={`rounded-lg px-4 py-2 text-xs font-bold ${tab===x?'bg-lime text-black':'border border-border'}`}>{x.toUpperCase()}</button>)}</div>{tab==='dispatch'&&<div className="grid gap-4 lg:grid-cols-[300px_1fr]"><section className="space-y-2">{data.crews.map(c=><button onClick={()=>setCrewId(c.id)} className={`w-full rounded-xl border p-4 text-left ${crewId===c.id?'border-lime':'border-border bg-panel'}`}><b>{c.name}</b><div className="text-xs text-muted">{data.trucks.find(t=>t.id===c.truckId)?.label} · {c.status}</div></button>)}<button onClick={()=>save(n=>n.crews.push({id:id(),name:'New Crew',truckId:n.trucks[0].id,leaderId:n.employees[0].id,memberIds:[],status:'base',gpsProgress:0,liveSpeed:0,coords:{x:30,y:60},photos:{before:null,after:null},messages:[],jobs:[]}))} className="w-full rounded-xl border border-dashed border-lime p-3 text-xs text-lime">+ New Crew</button></section><section className="rounded-2xl border border-border bg-panel p-5">{crew?<><div className="flex items-start justify-between"><div><h2 className="text-xl font-bold">{crew.name}</h2><p className="text-xs text-muted">Lead: {data.employees.find(e=>e.id===crew.leaderId)?.name||'—'}</p></div><select value={crew.status} onChange={e=>save(n=>n.crews.find(c=>c.id===crew.id).status=e.target.value)} className="rounded-lg border border-border bg-black p-2 text-xs"><option value="base">Idle</option><option value="en_route">En Route</option><option value="on_site">On Site</option><option value="completed">Completed</option></select></div><div className="mt-6 space-y-3"><h3 className="font-bold">Today's Jobs</h3>{crew.jobs.map(j=><div className="rounded-xl border border-border p-4"><b>{j.client}</b><p className="text-xs text-muted">{j.address} · {j.service}</p><p className="mt-2 text-xs text-lime">{j.scheduledTime}</p>{j.tasks.map(t=><label className="mt-2 flex gap-2 text-sm"><input type="checkbox" checked={t.done} onChange={()=>save(n=>{const q=n.crews.find(c=>c.id===crew.id).jobs.find(x=>x.id===j.id).tasks.find(x=>x.id===t.id);q.done=!q.done})}/>{t.text}</label>)}</div>)}<div className="rounded-xl border border-border p-4"><div className="grid gap-2 md:grid-cols-4">{Object.entries(job).map(([k,v])=><input value={v} placeholder={k} onChange={e=>setJob({...job,[k]:e.target.value})} className="rounded-lg border border-border bg-black p-2 text-xs"/>)}</div><button onClick={()=>{if(!job.client||!job.address||!job.service)return;save(n=>n.crews.find(c=>c.id===crew.id).jobs.push({id:id(),client:job.client,address:job.address,service:job.service,scheduledTime:job.time,estimatedEnd:'',arrivedAt:null,completedAt:null,tasks:[]}));setJob({client:'',address:'',service:'',time:''})}} className="mt-3 rounded-lg bg-lime px-4 py-2 text-xs font-bold text-black">Add Job</button></div></div></>:<p className="text-muted">Select a crew.</p>}</section></div>}{tab==='jobs'&&<div className="grid gap-3 md:grid-cols-2">{data.crews.flatMap(c=>c.jobs.map(j=><div className="rounded-xl border border-border bg-panel p-4"><b>{j.client}</b><p className="text-xs text-muted">{c.name} · {j.address}</p><p className="mt-2 text-xs">{j.tasks.filter(t=>t.done).length}/{j.tasks.length} tasks complete</p></div>))}</div>}{tab==='employees'&&<div className="grid gap-3 md:grid-cols-2 lg:grid-cols-3">{data.employees.map(e=><div className="rounded-xl border border-border bg-panel p-4"><b>{e.name}</b><p className="text-xs text-muted">{e.role} · PIN {e.pin}</p><p className="mt-2 text-sm">{e.clockedIn?'🟢 Clocked function Worker({data,setData,out,leader=false}){const emp=data.employees.find(e=>e.role===(leader?'leader':'member'));const crew=data.crews.find(c=>c.leaderId===emp?.id||c.memberIds.includes(emp?.id));const punch=()=>setData(d=>{const n=clone(d);const e=n.employees.find(x=>x.id===emp.id);e.clockedIn=!e.clockedIn;e.hoursToday=e.hoursToday+(e.clockedIn?0:0);n.punches.unshift({employee_id:e.id,employee_name:e.name,action:e.clockedIn?'in':'out',punched_at:new Date().toISOString()});n.isClockedIn=n.employees.some(x=>x.clockedIn);return n});return <Shell title={leader?'Crew Leader':'Crew Member'} onLogout={out}><div className="grid gap-4 md:grid-cols-2"><section className="rounded-2xl border border-border bg-panel p-6"><h2 className="text-2xl font-bold">{emp?.name}</h2><p className="text-muted">{crew?.name||'Unassigned'}</p><button onClick={punch} className={`mt-6 w-full rounded-xl py-4 font-black ${emp?.clockedIn?'bg-red-500 text-white':'bg-lime text-black'}`}>{emp?.clockedIn?'CLOCK OUT':'CLOCK IN'}</button></section>{crew&&<section className="rounded-2xl border border-border bg-panel p-6"><h3 className="font-bold">Current Job</h3>{crew.jobs[0]&&<><p className="mt-2 font-bold">{crew.jobs[0].client}</p><p className="text-sm text-muted">{crew.jobs[0].address}</p>{crew.jobs[0].tasks.map(t=><label className="mt-3 flex gap-2 text-sm"><input type="checkbox" checked={t.done} onChange={()=>setData(d=>{const n=clone(d);const q=n.crews.find(c=>c.id===crew.id).jobs[0].tasks.find(x=>x.id===t.id);q.done=!q.done;return n})}/>{t.text}</label>)}</>}</section>}</div></Shell>}

function App(){const [role,setRole]=useState(null),[data,setData]=useState(seed),[ready,setReady]=useState(false);useEffect(()=>{(async()=>{const {data:d}=await sb.from('app_state').select('state').eq('id',ID).maybeSingle();if(d?.state&&Object.keys(d.state).length)setData(d.state);setReady(true)})()},[]);useEffect(()=>{if(!ready)return;const t=setTimeout(()=>sb.from('app_state').upsert({id:ID,state:data,is_clocked_in:!!data.isClockedIn,updated_at:new Date().toISOString()}),300);return()=>clearTimeout(t)},[data,ready]);if(!role)return <Login setRole={setRole}/>;if(role==='admin')return <Admin data={data} setData={setData} out={()=>setRole(null)}/>;if(role==='leader')return <Worker data={data} setData={setData} out={()=>setRole(null)} leader/>;if(role==='employee')return <Worker data={data} setData={setData} out={()=>setRole(null)}/>;return <Client data={data} out={()=>setRole(null)}/>};ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
