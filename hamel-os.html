function Overview({data,setPage,act}){const active=data.crews.filter(c=>['EN_ROUTE','ON_SITE','WORKING'].includes(c.status)).length,working=data.jobs.filter(j=>j.status==='IN_PROGRESS').length,dispatch=data.jobs.filter(j=>j.status==='NEEDS_DISPATCH').length,done=data.jobs.filter(j=>j.status==='COMPLETED').length;return <><Title eyebrow="Operations Center" title="Good morning, Hamel team." sub="Live operational picture · centralized simulation state"/><div className="grid-kpi" style={{display:'grid',gridTemplateColumns:'repeat(4,minmax(0,1fr))',gap:12,marginBottom:16}}>{[['Active Crews',active,'route'],['Jobs Working',working,'jobs'],['Needs Dispatch',dispatch,'route'],['Completed',done,'check']].map(x=><Card key={x[0]} style={{padding:15}}><div style={{display:'flex',justifyContent:'space-between'}}><span className="small muted">{x[0]}</span><span style={{color:'#a8ff78'}}><Icon n={x[2]} s={16}/></span></div><div style={{fontSize:27,fontWeight:800,color:'#fff',marginTop:9}}>{x[1]}</div></Card>)}</div><div className="two-col" style={{display:'grid',gridTemplateColumns:'1.3fr .7fr',gap:14}}><Card><div style={{padding:15,borderBottom:'1px solid #222622',display:'flex',justifyContent:'space-between'}}><div><b style={{fontSize:13}}>Operational Pulse</b><div className="small muted" style={{marginTop:3}}>Crew status and current assignment</div></div><Btn small onClick={()=>setPage('fleet')}>Live Fleet →</Btn></div>{data.crews.map(c=><CrewRow key={c.id} c={c} />)}</Card><Card style={{padding:15}}><b style={{fontSize:13}}>Priority Queue</b><div className="small muted" style={{margin:'4px 0 14px'}}>Jobs requiring attention</div>{data.jobs.filter(j=>j.status==='NEEDS_DISPATCH'||j.status==='ON_THE_WAY').map(j=><div key={j.id} style={{padding:'11px 0',borderBottom:'1px solid #222622'}}><div style={{display:'flex',justifyContent:'space-between'}}><b style={{fontSize:12}}>{j.id}</b><Badge tone={statusTone(j.status)}>{statusLabel(j.status)}</Badge></div><div style={{fontSize:12,color:'#fff',marginTop:5}}>{j.property}</div><div className="small muted">{j.client} · {j.time}</div></div>)}<div style={{marginTop:14}}><Btn primary onClick={()=>setPage('dispatch')}>Open Dispatch</Btn></div></Card></div></>}
function CrewRow({c}){return <div style={{padding:'13px 15px',borderBottom:'1px solid #222622',display:'flex',alignItems:'center',gap:12}}><div style={{width:9,height:9,borderRadius:'50%',background:c.status==='WORKING'?'#60a5fa':'#a8ff78',boxShadow:'0 0 12px currentColor'}}/><div style={{flex:1}}><div style={{fontSize:12,fontWeight:750}}>{c.name} <span className="muted">· {c.leader}</span></div><div className="small muted">{c.vehicleId} · {c.jobId||'Unassigned'}</div></div><Badge tone={statusTone(c.status)}>{statusLabel(c.status)}</Badge><div className="mono" style={{fontSize:11,width:40,textAlign:'right'}}>{Math.round(c.progress)}%</div></div>}
function Dispatch({data,act}){return <><Title eyebrow="Operations" title="Dispatch Board" sub="Assignment is the only way a scheduled job enters the route lifecycle."/><div style={{display:'grid',gap:12}}>{data.jobs.map(j=>{const c=data.crews.find(x=>x.id===j.crewId);return <Card key={j.id} style={{padding:15,display:'flex',alignItems:'center',gap:14,flexWrap:'wrap'}}><div style={{width:72}}><b>{j.id}</b><div className="small muted">{j.time}</div></div><div style={{flex:1,minWidth:190}}><b style={{fontSize:13}}>{j.property}</b><div className="small muted">{j.client} · {j.address}</div></div><div style={{minWidth:150}}>{c?<><Badge>{c.name}</Badge><div className="small muted" style={{marginTop:5}}>{c.leader}</div></>:<Badge tone="yellow">Unassigned</Badge>}</div><Badge tone={statusTone(j.status)}>{statusLabel(j.status)}</Badge>{j.status==='NEEDS_DISPATCH'&&<select onChange={e=>e.target.value&&act(()=>window.HamelSimulation.assignJob(j.id,e.target.value),'Job assigned')} defaultValue="" style={{background:'#0d110d',color:'#e4e4e7',border:'1px solid #2b302b',borderRadius:9,padding:'8px'}}><option value="">Assign crew…</option>{data.crews.filter(c=>!c.jobId).map(c=><option key={c.id} value={c.id}>{c.name}</option>)}</select>}{c&&j.status==='SCHEDULED'&&<Btn primary small onClick={()=>act(()=>window.HamelSimulation.startRoute(c.id),c.name+' · route started')}>Start Route</Btn>}</Card>})}</div></>}
function Fleet({data,selected,setSelected}){const c=data.crews.find(x=>x.id===selected)||data.crews[0];return <><Title eyebrow="Field" title="Live Fleet" sub="Simulated telemetry is written to the same operational state used by every module."/><div className="map-layout" style={{display:'grid',gridTemplateColumns:'1fr 300px',gap:14}}><Card className="map-canvas radar" style={{height:540,position:'relative',overflow:'hidden'}}><div style={{position:'absolute',inset:0,padding:14,display:'flex',justifyContent:'space-between',pointerEvents:'none'}}><Badge>LIVE TELEMETRY</Badge><span className="small muted">GPS SIM · {data.crews.filter(x=>x.status==='EN_ROUTE').length} moving</span></div><svg viewBox="0 0 100 100" preserveAspectRatio="none" style={{position:'absolute',inset:0,width:'100%',height:'100%'}}><path d="M0 68 C20 48,30 82,45 58 S70 20,100 38" fill="none" stroke="#303630" strokeWidth="7" vectorEffect="non-scaling-stroke"/><path d="M0 68 C20 48,30 82,45 58 S70 20,100 38" fill="none" stroke="#1a1e1a" strokeWidth="2" vectorEffect="non-scaling-stroke"/></svg>{data.crews.map(x=><button key={x.id} onClick={()=>setSelected(x.id)} style={{position:'absolute',left:x.x+'%',top:x.y+'%',transform:'translate(-50%,-50%)',border:'1px solid '+(selected===x.id?'#fff':'#222622'),background:x.status==='WORKING'?'#60a5fa':'#a8ff78',color:'#071006',borderRadius:9,padding:'7px 8px',fontSize:9,fontWeight:900,boxShadow:selected===x.id?'0 0 0 5px rgba(168,255,120,.12)':'0 4px 16px rgba(0,0,0,.35)'}}>{x.name.replace('Crew ','')}</button>)}</Card><Card style={{padding:15}}><b style={{fontSize:13}}>Telemetry</b><div className="small muted" style={{margin:'4px 0 14px'}}>Selected unit</div>{c&&<><div style={{fontSize:20,fontWeight:800,color:'#fff'}}>{c.name}</div><div className="small muted">{c.leader} · {c.vehicleId}</div><div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:8,marginTop:15}}>{[['STATUS',statusLabel(c.status)],['SPEED',Math.round(c.speed)+' MPH'],['PROGRESS',Math.round(c.progress)+'%'],['JOB',c.jobId||'—']].map(x=><div key={x[0]} style={{background:'#0d110d',border:'1px solid #222622',borderRadius:9,padding:10}}><div style={{fontSize:8,color:'#657065',fontWeight:800}}>{x[0]}</div><div style={{fontSize:12,fontWeight:750,marginTop:5}}>{x[1]}</div></div>)}</div></>}</Card></div></>}
function Jobs({data,act}){return <><Title eyebrow="Operations" title="Jobs" sub="Job lifecycle is governed by the simulation engine."/><div style={{display:'grid',gap:12}}>{data.jobs.map(j=><Card key={j.id} style={{padding:15}}><div style={{display:'flex',gap:12,alignItems:'center',flexWrap:'wrap'}}><div style={{width:72}}><b>{j.id}</b><div className="small muted">{j.time}</div></div><div style={{flex:1,minWidth:190}}><b style={{fontSize:13}}>{j.property}</b><div className="small muted">{j.client} · {j.address}</div></div><Badge tone={statusTone(j.status)}>{statusLabel(j.status)}</Badge>{j.progress>0&&<span className="mono" style={{fontSize:11}}>{Math.round(j.progress)}%</span>}</div><div style={{height:5,background:'#202420',borderRadius:99,marginTop:13,overflow:'hidden'}}><div className="progress" style={{width:j.progress+'%',height:'100%',background:'#a8ff78'}}/></div><div style={{display:'flex',gap:7,marginTop:12,flexWrap:'wrap'}}>{j.tasks.map(t=><Badge key={t.id} tone={t.done?'lime':'gray'}>{t.done?'✓ ':''}{t.name}</Badge>)}</div>{j.crewId&&<div style={{marginTop:12,display:'flex',gap:7,flexWrap:'wrap'}}>{j.status==='ON_SITE'&&<Btn small primary onClick={()=>act(()=>window.HamelSimulation.startJob(j.crewId),'Job started')}>Start Job</Btn>}{j.status==='IN_PROGRESS'&&<><Btn small onClick={()=>act(()=>window.HamelSimulation.completeTask(j.crewId),'Task completed')}>Complete Next Task</Btn><Btn small onClick={()=>act(()=>window.HamelSimulation.uploadEvidence(j.crewId,'AFTER'),'Photo received')}>Add Evidence</Btn><Btn small primary onClick={()=>act(()=>window.HamelSimulation.completeJob(j.crewId),'Job completed')}>Complete Job</Btn></>}{j.status==='ON_THE_WAY'&&<Btn small onClick={()=>act(()=>window.HamelSimulation.arrive(j.crewId),'Crew arrived on site')}>Mark Arrived</Btn>}</div>}</Card>)}</div></>}
function People({data,act}){return <><Title eyebrow="People" title="Crew & Employees" sub="Personnel status is part of the same state model."/><div style={{display:'grid',gridTemplateColumns:'repeat(auto-fit,minmax(250px,1fr))',gap:12}}>{data.employees.map(e=><Card key={e.id} style={{padding:15}}><div style={{display:'flex',justifyContent:'space-between'}}><div><b style={{fontSize:13}}>{e.name}</b><div className="small muted">{e.role} · {data.crews.find(c=>c.id===e.crewId)?.name||'Office'}</div></div><Badge tone={e.clocked?'lime':'gray'}>{e.clocked?'CLOCKED IN':'OFF CLOCK'}</Badge></div><div style={{marginTop:13}}>{e.clocked?<Btn small onClick={()=>act(()=>window.HamelSimulation.clockOut(e.id),e.name+' · clocked out')}>Clock Out</Btn>:<Btn small primary onClick={()=>act(()=>window.HamelSimulation.clockIn(e.id),e.name+' · clocked in')}>Clock In</Btn>}</div></Card>)}</div></>}
function Clock({data,act}){const inCount=data.employees.filter(e=>e.clocked).length;return <><Title eyebrow="People" title="Time Clock" sub="Clock actions write to the centralized personnel state and timeline."/><Card style={{padding:18,marginBottom:14}}><div style={{fontSize:11,color:'#71717a'}}>CURRENTLY CLOCKED IN</div><div style={{fontSize:34,fontWeight:850,color:'#fff',marginTop:4}}>{inCount}<span style={{fontSize:13,color:'#71717a',fontWeight:500}}> / {data.employees.length}</span></div></Card><div style={{display:'grid',gap:9}}>{data.employees.map(e=><div key={e.id} style={{display:'flex',alignItems:'center',gap:12,background:'#121412',border:'1px solid #222622',borderRadius:10,padding:12}}><div style={{flex:1}}><b style={{fontSize:12}}>{e.name}</b><div className="small muted">{e.role}</div></div><Badge tone={e.clocked?'lime':'gray'}>{e.clocked?'IN':'OUT'}</Badge><Btn small onClick={()=>act(()=>e.clocked?window.HamelSimulation.clockOut(e.id):window.HamelSimulation.clockIn(e.id),e.name+(e.clocked?' · clocked out':' · clocked in'))}>{e.clocked?'Clock Out':'Clock In'}</Btn></div>)}</div></>}
function Evidence({data}){return <><Title eyebrow="Field" title="Evidence Feed" sub="Every photo is linked to a job and crew in the shared state."/>{data.evidence.length?<div style={{display:'grid',gridTemplateColumns:'repeat(auto-fit,minmax(220px,1fr))',gap:12}}>{data.evidence.map(e=><Card key={e.id} style={{padding:15}}><div style={{height:120,borderRadius:9,background:'linear-gradient(135deg,#182018,#0d110d)',display:'grid',placeItems:'center',color:'#a8ff78'}}><Icon n="camera" s={28}/></div><div style={{marginTop:11,fontSize:12,fontWeight:750}}>{e.label} · {e.jobId}</div><div className="small muted">{e.crewId} · {new Date(e.receivedAt).toLocaleTimeString()}</div></Card>)}</div>:<Card style={{padding:28,textAlign:'center'}}><Icon n="camera" s={28}/><div style={{fontWeight:750,marginTop:8}}>No evidence yet</div><div className="small muted" style={{marginTop:4}}>Photos added from Jobs will appear here.</div></Card>}</>}
function Timeline({data}){return <><Title eyebrow="Field" title="Timeline" sub="System events are generated by the simulation engine, not individual screens."/><Card style={{padding:0,overflow:'hidden'}}>{data.events.map((e,i)=><div key={e.id||i} style={{display:'grid',gridTemplateColumns:'92px 12px 1fr',gap:10,padding:'13px 15px',borderBottom:'1px solid #222622'}}><div className="small muted mono">{new Date(e.at).toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'})}</div><div style={{width:8,height:8,borderRadius:'50%',background:e.type==='GPS_LOCK'?'#60a5fa':'#a8ff78',marginTop:3}}/><div><div style={{fontSize:12,fontWeight:750}}>{e.title}</div><div className="small muted">{e.actor} · {e.detail}</div></div></div>)}</Card></>}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script></body></html>
